- time: "01:00"
  text: "Support (Турбо): Получил 2-й уровень? Немедленно делай телепорт для ганга."
- time: "02:30"
  text: "Support (Турбо): Постоянно носи телепорт. Будь готов к любой драке."
- time: "04:00"
  text: "Support (Турбо): Ставь агрессивные варды глубоко на вражеской территории."
- time: "05:30"
  text: "Support (Турбо): Группируйтесь. Начинайте ходить впятером и сносить башни."
- time: "07:00"
  text: "Support (Турбо): Контролируй аванпосты. Это ключевое преимущество по опыту."
- time: "09:00"
  text: "Support (Турбо): Проверь Рошана. Поставь Sentry, чтобы враги не забрали его втихую."
- time: "11:00"
  text: "Support (Турбо): Следи за вражескими предметами. Сообщай команде, у кого из врагов нет BKB."
- time: "14:00"
  text: "Support (Турбо): Купи Smoke of Deceit. Найдите и убейте одинокого врага, чтобы забрать объект."
- time: "17:00"
  text: "Support (Турбо): Снимай вражеские варды. Контроль карты на этой стадии решает все."
- time: "20:00"
  text: "Support (Турбо): Твоя позиция в драке - ключ. Не умирай первым. Спасай своих коров."
- time: "24:00"
  text: "Support (Турбо): Покупай и ставь Sentry везде. Обзор важнее, чем твои предметы."
- time: "28:00"
  text: "Support (Турбо): Держи деньги на выкуп. Твои скиллы нужны для защиты базы."
- time: "33:00"
  text: "Support (Турбо): Проси команду забрать Рошана. Контролируй подходы к нему."
- time: "38:00"
  text: "Support (Турбо): Начинай покупать дорогие предметы, которые меняют драку (Scythe of Vyse, Refresher)."
- time: "44:00"
  text: "Support (Турбо): Не выходи с базы один. Смерть саппорта на этой стадии - это потеря обзора на 2 минуты."
- time: "50:00"
  text: "Support (Турбо): Проверяй выкупы врагов перед каждой дракой."
- time: "56:00"
  text: "Support (Турбо): В последней драке твоя задача - дать самые важные скиллы во вражеского керри."