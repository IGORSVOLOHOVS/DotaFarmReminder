- time: "00:20"
  text: "Support: Не дай врагу заблокировать ваш малый лагерь. Разблокируй, если нужно."
- time: "00:53"
  text: "Support: STACK. Отводи большой лагерь. Это твой главный вклад в GPM керри."
- time: "01:15"
  text: "Support: PULL. Начни отвод малого лагеря. Это вернет линию и даст тебе опыт/золото."
- time: "01:53"
  text: "Support: STACK. Второй стак. Старайся делать это незаметно для врага."
- time: "02:20"
  text: "Support: CHAIN PULL. Если малый лагерь зачищен, сагри крипов с большого на ~X:23."
- time: "02:50"
  text: "Support: Контролируй руну богатства. Это золото для всей команды."
- time: "03:25"
  text: "Support: Агрессивно денай своих крипов, чтобы линия не пушилась."
- time: "03:53"
  text: "Support: STACK. Не пропускай ни одной возможности."
- time: "04:45"
  text: "Support: Сделай отвод, чтобы керри мог безопасно фармить под башней."
- time: "05:53"
  text: "Support: STACK. Продолжай стакать, даже если керри еще не может их забрать. Они окупятся."
- time: "06:40"
  text: "Support: Забери руну мудрости. Это чистый опыт для тебя и команды."
- time: "08:00"
  text: "Support: Помоги керри забрать стаки. Дай вижн, будь готов спасти."
- time: "10:00"
  text: "Support: Если твой керри ушел в лес, иди на линию и получай с нее опыт и золото."