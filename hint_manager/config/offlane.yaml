- time: "00:45"
  text: "Offlane (Турбо): Твоя задача - не давать вражескому керри играть. Постоянно нападай на него."
- time: "02:00"
  text: "Offlane (Турбо): Как только получишь 3-й уровень, попытайся убить вражеского керри."
- time: "03:30"
  text: "Offlane (Турбо): Цель: снести вражескую первую башню к 5-й минуте. Не отходи от нее."
- time: "05:00"
  text: "Offlane (Турбо): Башня сломана. Немедленно иди во вражеский лес и выгоняй оттуда всех."
- time: "06:30"
  text: "Offlane (Турбо): У тебя должен быть Blink Dagger или Vanguard. Начинай драки без остановки."
- time: "08:00"
  text: "Offlane (Турбо): Собирай команду и иди пушить вторую башню. Не давай врагам продохнуть."
- time: "10:00"
  text: "Offlane (Турбо): Твоя цель - быть в центре каждой драки. Покупай предметы, которые помогут тебе выжить."
- time: "12:00"
  text: "Offlane (Турбо): Начинайте заходить на базу врага. Игра должна скоро закончиться."