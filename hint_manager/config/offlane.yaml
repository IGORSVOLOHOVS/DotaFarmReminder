- time: "00:45"
  text: "Offlane: Твоя цель - не дать вражескому керри добить ни одного крипа."
- time: "01:30"
  text: "Offlane: Сагри вражеских крипов, чтобы они атаковали твоего крипа-мага. Это отпушит линию."
- time: "02:15"
  text: "Offlane: Убил вражескую волну? Не стой на месте, иди и укради их малый лагерь."
- time: "03:00"
  text: "Offlane: Цель: получить 3-й уровень раньше вражеского керри. Используй это преимущество."
- time: "04:15"
  text: "Offlane: Запушил линию? Проверь вражеский большой лагерь. Возможно, он свободен."
- time: "05:20"
  text: "Offlane: Ночь. Хорошее время, чтобы прорезать волну крипов за вражеской башней."
- time: "06:15"
  text: "Offlane: Забери руну богатства. Это ослабит их и усилит тебя."
- time: "07:00"
  text: "Offlane: Используй преимущество, чтобы снести Т1 башню. Это откроет их лес для фарма."
- time: "08:30"
  text: "Offlane: Начинай активно фармить вражеский лес. Каждый убитый там крип - минус для врага."
- time: "10:00"
  text: "Offlane: Твой GPM должен быть сравним с вражеским керри, если ты доминируешь."
- time: "12:00"
  text: "Offlane: Ищи пустые линии по всей карте и забирай с них фарм, пока создаешь давление."