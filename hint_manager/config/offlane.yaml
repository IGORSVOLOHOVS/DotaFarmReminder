- time: "00:15"
  text: "Offlane: Постарайся заблокировать вражеский большой лагерь."
- time: "00:45"
  text: "Offlane: Будь агрессивным. Не давай вражескому керри добивать крипов."
- time: "01:30"
  text: "Offlane: Контролируй агро крипов, чтобы линия была выгодна для тебя."
- time: "02:15"
  text: "Offlane: Убил вражескую волну? Иди и укради их малый лагерь."
- time: "03:00"
  text: "Offlane: Цель: получить 3-й уровень раньше вражеского керри."
- time: "03:45"
  text: "Offlane: Попроси своего саппорта прийти на ганг. Убейте керри."
- time: "04:30"
  text: "Offlane: Покупай предметы на регенерацию (Ring of Health), чтобы оставаться на линии."
- time: "05:20"
  text: "Offlane: Ночь. Отличная возможность для агрессии, если у тебя есть вижн."
- time: "06:15"
  text: "Offlane: Проверь руну богатства. Попробуй украсть ее."
- time: "07:00"
  text: "Offlane: Уровень 6? Используй ультимейт, чтобы убить керри и начать давить на башню."
- time: "08:30"
  text: "Offlane: Если ты снес Т1 башню, начинай фармить вражеский лес, создавая давление."
- time: "10:00"
  text: "Offlane: Vanguard или Hood of Defiance должны быть готовы. Ты - фронтлейн."
- time: "12:00"
  text: "Offlane: Начинай смещаться по карте. Твой фарм теперь - это убийства и пустые линии."