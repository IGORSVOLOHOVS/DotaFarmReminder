- time: "01:15"
  text: "Offlane (Турбо): Получил 2-3 уровень? Убей вражеского керри. Будь наглым."
- time: "03:00"
  text: "Offlane (Турбо): Цель: снести вражескую Т1 башню к 4-5 минуте. Не отходи от нее."
- time: "05:00"
  text: "Offlane (Турбо): Башня сломана. Немедленно иди во вражеский лес, выгоняй оттуда всех и ломай всё."
- time: "06:30"
  text: "Offlane (Турбо): Первый ключевой предмет готов. Инициируй драки без остановки."
- time: "08:00"
  text: "Offlane (Турбо): Собирай команду и иди пушить Т2. Не давай врагам продохнуть."
- time: "10:00"
  text: "Offlane (Турбо): Твоя цель - быть в центре каждой драки. Заставь врагов бить тебя, а не твоего керри."
- time: "12:30"
  text: "Offlane (Турбо): Начинайте заходить на хайграунд. Твоя задача - сломать позицию врага."
- time: "15:00"
  text: "Offlane (Турбо): Контролируй Рошана. Ты должен быть тем, кто начинает драку за него."
- time: "19:00"
  text: "Offlane (Турбо): Постоянно находись на вражеской половине карты, отпушивая линии и создавая давление."
- time: "23:00"
  text: "Offlane (Турбо): Второй ключевой предмет, который усилит твою команду (Aura items) или выживаемость, должен быть готов."
- time: "27:00"
  text: "Offlane (Турбо): Ищи возможность поймать и убить ключевого вражеского героя без выкупа."
- time: "32:00"
  text: "Offlane (Турбо): Держи деньги на выкуп. Ты должен быть в каждой важной драке."
- time: "37:00"
  text: "Offlane (Турбо): Третий Рошан. Аегис на тебе или на керри - залог успешного штурма базы."
- time: "42:00"
  text: "Offlane (Турбо): Не инициируй, если не уверен в поддержке команды. Одна ошибка может стоить игры."
- time: "48:00"
  text: "Offlane (Турбо): Твоя задача - выманить выкупы у врагов перед решающей дракой."
- time: "54:00"
  text: "Offlane (Турбо): Защищай своих саппортов. Без них у вас не будет обзора и контроля."
- time: "60:00"
  text: "Offlane (Турбо): Финальная драка. Фокусируй самую опасную цель. Не дай ему использовать ключевые способности."