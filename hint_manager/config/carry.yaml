- time: "00:45"
  text: "Carry: Цель: 4+ крипа с первой волны. Контролируй равновесие линии."
- time: "01:20"
  text: "Carry: Сагри вражеских крипов, чтобы они остановились ближе к твоей башне."
- time: "01:50"
  text: "Carry: Целевой крипстат (CS): 12-15. Попроси саппорта сделать отвод."
- time: "02:30"
  text: "Carry: Оцени свой GPM (золото в минуту). Он должен расти."
- time: "03:10"
  text: "Carry: После убийства волны (~X:15), у тебя есть ~25 секунд на ближний лесной лагерь."
- time: "03:45"
  text: "Carry: Целевой CS: 20-25. Не пропусти катапульту, она дает много золота."
- time: "04:30"
  text: "Carry: Максимизируй ластхиты под своей башней (воин: 2 удара башни, 1 твой; маг: 1 удар башни, 1 твой)."
- time: "05:15"
  text: "Carry: Ночь. Если линия опасна - смести свой фарм-паттерн полностью в лес."
- time: "06:00"
  text: "Carry: Целевой CS: 35-40. Проверь руну богатства."
- time: "07:30"
  text: "Carry: Начинай постоянный цикл 'Линия -> Лес -> Линия'. Не ходи пешком без дела."
- time: "08:15"
  text: "Carry: Целевой CS: 45-50. Проверь стаки, которые сделал саппорт."
- time: "09:00"
  text: "Carry: Время фармить застаканные лагеря. Используй скиллы для ускорения."
- time: "10:00"
  text: "Carry: ЦЕЛЬ: 60-70+ крипов. Это критическая отметка для хорошего старта."
- time: "11:30"
  text: "Carry: Отпушивай линию до вражеской башни и сразу уходи фармить их лес."
- time: "13:00"
  text: "Carry: Целевой CS: 85-90. Ты должен опережать вражеского керри по фарму."
- time: "14:00"
  text: "Carry: Оцени карту. Где самый безопасный и выгодный фарм в следующие 2 минуты?"
- time: "15:00"
  text: "Carry: ЦЕЛЬ: 110-120+ крипов. Твой GPM должен быть выше 500."