- time: "00:15"
  text: "Carry: Купи Quelling Blade. Заблокируй малый лагерь своим вардом."
- time: "00:45"
  text: "Carry: Цель: 4 крипа с первой волны. Следи за вражеским offlane'ром."
- time: "01:20"
  text: "Carry: После убийства волны, сагри следующую на себя, чтобы удержать линию."
- time: "01:50"
  text: "Carry: Цель: 12-15 крипов. Если линия отпушена, попроси саппорта сделать отвод."
- time: "02:30"
  text: "Carry: Начинай копить на Power Treads или Phase Boots."
- time: "03:10"
  text: "Carry: Если убил волну быстро, у тебя есть ~20 секунд на ближний лесной лагерь."
- time: "03:45"
  text: "Carry: Цель: 20-25 крипов. Не пропускай катапульту."
- time: "04:30"
  text: "Carry: Заверши сапог. Попроси принести Magic Stick, если на линии спамят скиллами."
- time: "05:15"
  text: "Carry: Ночь. Играй осторожнее. Если линия опасна - уходи в лес."
- time: "06:00"
  text: "Carry: Цель: 35-40 крипов. Проверь руну богатства."
- time: "06:45"
  text: "Carry: Руна мудрости. Скажи саппорту забрать ее."
- time: "07:30"
  text: "Carry: Начинай активно переключаться между линией и лесом."
- time: "08:15"
  text: "Carry: Цель: 45-50 крипов. Проверь стаки, которые сделал саппорт."
- time: "09:00"
  text: "Carry: Время фармить застаканные лагеря. Используй скиллы для ускорения."
- time: "10:00"
  text: "Carry: ЦЕЛЬ: 60+ крипов. У тебя должен быть первый крупный артефакт (Yasha, Maelstrom)."
- time: "11:30"
  text: "Carry: Отпушивай линию до вражеской башни и сразу уходи в их лес."
- time: "13:00"
  text: "Carry: Цель: 85-90 крипов. Не появляйся на карте без надобности. Фарми."
- time: "14:00"
  text: "Carry: Руна мудрости. Координируйся с командой."
- time: "15:00"
  text: "Carry: ЦЕЛЬ: 110+ крипов. Думай о покупке BKB или другого ключевого артефакта."